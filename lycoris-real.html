<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>曼珠沙华 - Lycoris Radiata</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #050508; overflow: hidden; }
    </style>
</head>
<body>
    <script>
        let flowers = [];
        
        class Lycoris {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.petals = [];
                this.stamens = [];
                this.bloomPhase = 0;
                this.maxSize = 60 + random(50);
                this.rotation = random(TWO_PI);
                this.numPetals = 6 + floor(random(3));
                
                for (let i = 0; i < this.numPetals; i++) {
                    this.petals.push({
                        angle: (TWO_PI / this.numPetals) * i,
                        wavePhase: random(TWO_PI),
                        lengthMult: random(0.85, 1.15)
                    });
                }
                
                this.numStamens = 6 + floor(random(2));
                for (let i = 0; i < this.numStamens; i++) {
                    this.stamens.push({
                        angle: (TWO_PI / this.numStamens) * i + random(-0.3, 0.3),
                        length: this.maxSize * (1.2 + random(0.4))
                    });
                }
            }
            
            update() {
                this.bloomPhase += 0.01;
            }
            
            display() {
                push();
                translate(this.x, this.y);
                rotate(this.rotation);
                
                let bloom = min(this.bloomPhase, 1);
                
                for (let stamen of this.stamens) {
                    this.drawStamen(stamen, bloom);
                }
                
                for (let petal of this.petals) {
                    this.drawPetal(petal, bloom);
                }
                
                pop();
            }
            
            drawPetal(petal, bloom) {
                push();
                rotate(petal.angle);
                
                let len = this.maxSize * petal.lengthMult * bloom;
                let wave = sin(frameCount * 0.02 + petal.wavePhase) * 8;
                
                noStroke();
                fill(210, 20, 50, 240);
                
                beginShape();
                for (let t = 0; t <= 1; t += 0.03) {
                    let y = -t * len;
                    let curl = sin(t * PI) * 25 * t;
                    let w = 6 + sin(t * PI) * 8;
                    let x = wave * t + curl;
                    vertex(x - w * 0.5, y);
                }
                for (let t = 1; t >= 0; t -= 0.03) {
                    let y = -t * len;
                    let curl = sin(t * PI) * 25 * t;
                    let w = 6 + sin(t * PI) * 8;
                    let x = wave * t + curl;
                    vertex(x + w * 0.5, y);
                }
                endShape(CLOSE);
                
                fill(255, 255, 255, 80);
                beginShape();
                for (let t = 0.2; t <= 0.9; t += 0.03) {
                    let y = -t * len;
                    let curl = sin(t * PI) * 25 * t;
                    let w = 2 + sin(t * PI) * 3;
                    let x = wave * t + curl;
                    vertex(x - w * 0.5, y);
                }
                for (let t = 0.9; t >= 0.2; t -= 0.03) {
                    let y = -t * len;
                    let curl = sin(t * PI) * 25 * t;
                    let w = 2 + sin(t * PI) * 3;
                    let x = wave * t + curl;
                    vertex(x + w * 0.5, y);
                }
                endShape(CLOSE);
                
                pop();
            }
            
            drawStamen(stamen, bloom) {
                push();
                rotate(stamen.angle);
                
                let len = stamen.length * bloom;
                let curve = sin(frameCount * 0.03 + stamen.angle) * 5;
                
                stroke(255, 210, 150, 220);
                strokeWeight(1.5);
                noFill();
                
                beginShape();
                for (let t = 0; t <= 1; t += 0.1) {
                    let y = -t * len;
                    let x = curve * t * t;
                    vertex(x, y + 10);
                }
                endShape();
                
                let tipY = -len + 10;
                let tipX = curve;
                fill(255, 220, 180, 230);
                noStroke();
                ellipse(tipX, tipY, 4, 7);
                
                fill(255, 200, 100, 150);
                for (let i = 0; i < 5; i++) {
                    let px = tipX + random(-3, 3);
                    let py = tipY + random(-5, 5);
                    ellipse(px, py, 1, 2);
                }
                
                pop();
            }
        }
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            
            for (let i = 0; i < 5; i++) {
                let x = random(width * 0.15, width * 0.85);
                let y = random(height * 0.35, height * 0.75);
                flowers.push(new Lycoris(x, y));
            }
        }
        
        function draw() {
            drawBackground();
            
            for (let f of flowers) {
                f.update();
                f.display();
            }
            
            if (flowers.length < 8 && random() < 0.008) {
                let x = random(width * 0.15, width * 0.85);
                let y = random(height * 0.35, height * 0.75);
                flowers.push(new Lycoris(x, y));
            }
        }
        
        function drawBackground() {
            for (let y = 0; y < height; y++) {
                let t = y / height;
                let r = 5 + t * 10;
                let g = 3 + t * 5;
                let b = 8 + t * 12;
                stroke(r, g, b);
                line(0, y, width, y);
            }
            
            for (let i = 0; i < 200; i++) {
                let x = noise(i * 0.08, frameCount * 0.0003) * width;
                let y = noise(i * 0.12 + 1000, frameCount * 0.0002) * height;
                let b = 80 + sin(i + frameCount * 0.015) * 60;
                fill(255, 250, 245, b * 0.25);
                noStroke();
                ellipse(x, y, 1.2, 1.2);
            }
        }
        
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
