<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彼岸花 - Lycoris</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #080510; overflow: hidden; }
    </style>
</head>
<body>
    <script>
        let flowers = [];
        let bokeh = [];
        
        class Lycoris {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.petals = [];
                this.stamens = [];
                this.pistils = [];
                this.bloomPhase = 0;
                this.maxSize = 100 + random(60);
                this.rotation = random(TWO_PI);
                this.numPetals = 6 + floor(random(5));
                
                for (let i = 0; i < this.numPetals; i++) {
                    this.petals.push({
                        angle: (TWO_PI / this.numPetals) * i,
                        offset: random(-0.3, 0.3),
                        lengthMult: random(0.8, 1.2),
                        wave: random(2, 4)
                    });
                }
                
                for (let i = 0; i < 8; i++) {
                    this.stamens.push({
                        angle: (TWO_PI / 8) * i + random(-0.4, 0.4),
                        length: this.maxSize * (1.3 + random(0.5))
                    });
                }
                
                for (let i = 0; i < 3; i++) {
                    this.pistils.push({
                        angle: random(-0.5, 0.5),
                        length: this.maxSize * (1.5 + random(0.3))
                    });
                }
            }
            
            update() {
                this.bloomPhase += 0.008;
            }
            
            display() {
                push();
                translate(this.x, this.y);
                rotate(this.rotation);
                
                let bloom = min(this.bloomPhase, 1);
                
                this.drawStem(bloom);
                
                for (let stamen of this.stamens) {
                    this.drawStamen(stamen, bloom);
                }
                
                for (let pistil of this.pistils) {
                    this.drawPistil(pistil, bloom);
                }
                
                for (let petal of this.petals) {
                    this.drawPetal(petal, bloom);
                }
                
                pop();
            }
            
            drawStem(bloom) {
                let len = 150 + this.maxSize * 0.4;
                
                stroke(25, 60, 35, 200);
                strokeWeight(4);
                noFill();
                
                beginShape();
                for (let t = 0; t <= 1; t += 0.1) {
                    let y = t * len * bloom;
                    let x = sin(t * PI) * 8;
                    vertex(x, y);
                }
                endShape();
            }
            
            drawPetal(petal, bloom) {
                push();
                rotate(petal.angle + petal.offset);
                
                let len = this.maxSize * petal.lengthMult * bloom;
                
                noStroke();
                fill(225, 25, 45, 255);
                
                beginShape();
                
                for (let t = 0; t <= 1; t += 0.03) {
                    let y = -t * len;
                    let wave = sin(t * PI * petal.wave + frameCount * 0.02) * (10 * t);
                    let curl = sin(t * PI) * 40 * t;
                    let x = wave + curl;
                    let w = 6 + sin(t * PI) * 12;
                    vertex(x - w, y);
                }
                
                for (let t = 1; t >= 0; t -= 0.03) {
                    let y = -t * len;
                    let wave = sin(t * PI * petal.wave + frameCount * 0.02) * (10 * t);
                    let curl = sin(t * PI) * 40 * t;
                    let x = wave + curl;
                    let w = 6 + sin(t * PI) * 12;
                    vertex(x + w, y);
                }
                
                endShape(CLOSE);
                
                fill(255, 240, 245, 100);
                beginShape();
                
                for (let t = 0.2; t <= 0.9; t += 0.03) {
                    let y = -t * len;
                    let wave = sin(t * PI * petal.wave + frameCount * 0.02) * (10 * t);
                    let curl = sin(t * PI) * 40 * t;
                    let x = wave + curl;
                    let w = 2 + sin(t * PI) * 4;
                    vertex(x - w, y);
                }
                
                for (let t = 0.9; t >= 0.2; t -= 0.03) {
                    let y = -t * len;
                    let wave = sin(t * PI * petal.wave + frameCount * 0.02) * (10 * t);
                    let curl = sin(t * PI) * 40 * t;
                    let x = wave + curl;
                    let w = 2 + sin(t * PI) * 4;
                    vertex(x + w, y);
                }
                
                endShape(CLOSE);
                
                pop();
            }
            
            drawStamen(stamen, bloom) {
                push();
                rotate(stamen.angle);
                
                let len = stamen.length * bloom;
                
                stroke(235, 60, 75, 230);
                strokeWeight(1.5);
                noFill();
                
                beginShape();
                for (let t = 0; t <= 1; t += 0.08) {
                    let y = -t * len;
                    let x = sin(t * PI * 1.5) * 20 * t * t;
                    vertex(x, y + 20);
                }
                endShape();
                
                let tipT = 0.95;
                let tipY = -tipT * len + 20;
                let tipX = sin(tipT * PI * 1.5) * 20 * tipT * tipT;
                
                fill(255, 190, 80, 240);
                noStroke();
                ellipse(tipX, tipY, 5, 8);
                
                fill(255, 170, 50, 130);
                for (let i = 0; i < 10; i++) {
                    let px = tipX + random(-5, 5);
                    let py = tipY + random(-8, 8);
                    ellipse(px, py, 1.2, 2);
                }
                
                pop();
            }
            
            drawPistil(pistil, bloom) {
                push();
                rotate(pistil.angle);
                
                let len = pistil.length * bloom;
                
                stroke(210, 80, 95, 220);
                strokeWeight(1.2);
                noFill();
                
                beginShape();
                for (let t = 0; t <= 1; t += 0.08) {
                    let y = -t * len;
                    let x = sin(t * PI * 1.2) * 15 * t;
                    vertex(x, y + 20);
                }
                endShape();
                
                let tipT = 0.98;
                let tipY = -tipT * len + 20;
                let tipX = sin(tipT * PI * 1.2) * 15 * tipT;
                
                fill(255, 100, 120, 220);
                noStroke();
                ellipse(tipX, tipY, 4, 6);
                
                pop();
            }
        }
        
        class Bokeh {
            constructor() {
                this.x = random(width);
                this.y = random(height);
                this.size = random(30, 150);
                this.color = [random(50, 255), random(30, 180), random(60, 220)];
                this.alpha = random(40, 150);
                this.phase = random(TWO_PI);
            }
            display() {
                let a = this.alpha + sin(frameCount * 0.01 + this.phase) * 40;
                fill(this.color[0], this.color[1], this.color[2], a);
                noStroke();
                ellipse(this.x, this.y, this.size, this.size);
            }
        }
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            
            for (let i = 0; i < 35; i++) {
                bokeh.push(new Bokeh());
            }
            
            let x = width * 0.5;
            let y = height * 0.35;
            flowers.push(new Lycoris(x, y));
        }
        
        function draw() {
            drawBackground();
            
            for (let b of bokeh) {
                b.display();
            }
            
            for (let f of flowers) {
                f.update();
                f.display();
            }
            
            if (flowers.length < 3 && random() < 0.003) {
                let x = random(width * 0.2, width * 0.8);
                let y = random(height * 0.3, height * 0.5);
                flowers.push(new Lycoris(x, y));
            }
        }
        
        function drawBackground() {
            for (let y = 0; y < height; y++) {
                let t = y / height;
                let r = 8 + t * 12;
                let g = 5 + t * 18;
                let b = 15 + t * 25;
                stroke(r, g, b);
                line(0, y, width, y);
            }
            
            for (let i = 0; i < 200; i++) {
                let x = noise(i * 0.08, frameCount * 0.0003) * width;
                let y = noise(i * 0.12 + 800, frameCount * 0.0002) * height;
                let b = 70 + sin(i + frameCount * 0.015) * 55;
                fill(255, 250, 245, b * 0.25);
                noStroke();
                ellipse(x, y, 1.2, 1.2);
            }
        }
        
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
